<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#24453d" />
    <title>Project · CIV E 265 exhibition</title>
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <a class="skip" href="#project-title">Skip to project</a>
    <header class="mast">
      <a class="identity" href="index.html#collection">
        CIV E 265
        <span>/</span>
        Design exhibition
      </a>
      <nav class="mast-nav">
        <a href="preview.html">Preview your model</a>
        <span>Fall 2025</span>
      </nav>
    </header>
    <main class="wrap project">
      <a class="back" href="index.html#collection">← Collection</a>
      <p class="kicker" id="project-id"></p>
      <h1 id="project-title">Loading project…</h1>
      <p id="error" role="status"></p>
      <div id="details" hidden>
        <div class="project-layout">
          <figure class="plate">
            <a id="open-image" title="Open original image">
              <img id="art" alt="" />
            </a>
            <figcaption>
              <span id="caption">Submitted project image</span>
              <span>Original image ↗</span>
            </figcaption>
          </figure>
          <aside>
            <h2>Project statement</h2>
            <div id="statement" class="statement"></div>
            <a class="action secondary" id="dyn" hidden download>
              Download Dynamo file ↓
            </a>
          </aside>
        </div>
        <section class="model" aria-labelledby="model-title">
          <div class="model-head">
            <div>
              <p class="kicker">Interactive view</p>
              <h2 id="model-title">3D model</h2>
              <p id="model-note"></p>
            </div>
            <button class="action" id="load" hidden>View model</button>
          </div>
          <p id="progress" role="status" aria-live="polite"></p>
          <div
            id="viewport"
            hidden
            tabindex="0"
            aria-label="3D model. Use arrow keys to orbit, plus or minus to zoom, and Home to reset."
          ></div>
          <div id="controls" class="controls" hidden>
            <button id="zoom-in" disabled>Zoom in</button>
            <button id="zoom-out" disabled>Zoom out</button>
            <button id="reset">Reset view</button>
            <button id="close-view">Close viewer</button>
            <span>
              Drag or use arrow keys to rotate. Scroll or use + / − to zoom.
            </span>
          </div>
        </section>
      </div>
    </main>
    <footer class="mast">
      <span>CIV E 265 · University of Alberta</span>
      <a href="index.html#collection">All projects →</a>
    </footer>
    <noscript>Enable JavaScript to view this submission.</noscript>
    <script type="module" src="project.js"></script>
  </body>
</html>
